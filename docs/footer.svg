<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 150" width="1280" height="150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2e88" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#4a0d5c"/>
      <stop offset="1" stop-color="#05010f"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect width="1280" height="150" rx="22"/></clipPath>
    <style>
      .dash { stroke-dasharray: 40 30; animation: run .5s linear infinite; }
      @keyframes run { to { stroke-dashoffset: 70; } }
      .car { animation: drive 5s linear infinite; }
      .cop { animation: drive 5s linear infinite -0.9s; }
      @keyframes drive { from { transform: translateX(-160px); } to { transform: translateX(1440px); } }
      .siren { animation: siren .4s steps(1) infinite; }
      @keyframes siren { 0% { fill: #ff2e55; } 50% { fill: #2e7bff; } }
      .t { font: 900 22px 'Arial Black','Segoe UI Black',Impact,sans-serif; font-style: italic; letter-spacing: 6px; }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1280" height="150" fill="url(#bg)"/>
    <rect x="0" y="92" width="1280" height="46" fill="#14121f"/>
    <rect x="0" y="90" width="1280" height="3" fill="#00e5ff" filter="url(#glow)"/>
    <rect x="0" y="137" width="1280" height="3" fill="#00e5ff" filter="url(#glow)"/>
    <line class="dash" x1="0" y1="115" x2="1280" y2="115" stroke="#ffd23f" stroke-width="3"/>
    <!-- Player, side view -->
    <g class="car">
      <path d="M0 122 L4 108 L28 104 L44 94 L82 94 L100 106 L120 109 L122 122 Z" fill="#00b8e6"/>
      <path d="M48 97 L80 97 L92 106 L40 106 Z" fill="#0a1a2e"/>
      <circle cx="26" cy="123" r="8" fill="#0b0b12"/><circle cx="98" cy="123" r="8" fill="#0b0b12"/>
      <rect x="116" y="110" width="7" height="4" rx="2" fill="#fffbe0" filter="url(#glow)"/>
      <path d="M0 112 L-34 116 L0 119 Z" fill="#7ef9ff" filter="url(#glow)"/>
    </g>
    <!-- Police chasing -->
    <g class="cop">
      <g transform="translate(-170 0)">
        <path d="M0 122 L4 108 L28 104 L44 94 L82 94 L100 106 L120 109 L122 122 Z" fill="#1d2a6b"/>
        <rect x="4" y="110" width="116" height="5" fill="#f5f5f5"/>
        <path d="M48 97 L80 97 L92 106 L40 106 Z" fill="#0a1a2e"/>
        <rect x="54" y="88" width="9" height="6" rx="1" class="siren"/>
        <rect x="64" y="88" width="9" height="6" rx="1" fill="#2e7bff" class="siren" style="animation-delay:.2s"/>
        <circle cx="26" cy="123" r="8" fill="#0b0b12"/><circle cx="98" cy="123" r="8" fill="#0b0b12"/>
      </g>
    </g>
    <text x="640" y="58" text-anchor="middle" class="t" fill="url(#txt)" filter="url(#glow)">DRIVE FAST · DODGE SMART · NO BRAIN REQUIRED</text>
  </g>
</svg>
