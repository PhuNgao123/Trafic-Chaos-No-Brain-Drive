<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 26" width="1280" height="26">
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#ff2e88"/>
      <stop offset="0.8" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#fff"/>
      <stop offset="0.85" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1280" height="26" fill="url(#fade)"/></mask>
    <style>
      .dash { stroke-dasharray: 34 26; animation: run .6s linear infinite; }
      @keyframes run { to { stroke-dashoffset: -60; } }
    </style>
  </defs>
  <g mask="url(#m)">
    <rect x="0" y="4" width="1280" height="18" rx="9" fill="#14121f"/>
    <line class="dash" x1="0" y1="13" x2="1280" y2="13" stroke="#ffd23f" stroke-width="3"/>
  </g>
  <rect x="0" y="2" width="1280" height="2" fill="url(#edge)"/>
  <rect x="0" y="22" width="1280" height="2" fill="url(#edge)"/>
</svg>
