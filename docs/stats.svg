<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 190" width="1280" height="190">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0638"/>
      <stop offset="1" stop-color="#0a0216"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#2e7bff"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff7b39"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2e88"/><stop offset="1" stop-color="#b14dff"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3dff9a"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <linearGradient id="b5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7b39"/><stop offset="1" stop-color="#ff2e55"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .card { opacity: 0; animation: up .7s cubic-bezier(.2,.9,.3,1.3) forwards; }
      .card:nth-of-type(2) { animation-delay: .12s; }
      .card:nth-of-type(3) { animation-delay: .24s; }
      .card:nth-of-type(4) { animation-delay: .36s; }
      .card:nth-of-type(5) { animation-delay: .48s; }
      @keyframes up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
      .num { font: 900 54px 'Arial Black','Segoe UI Black',Impact,sans-serif; font-style: italic; }
      .lbl { font: 700 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing: 3px; fill: #e8e3ff; }
      .sub { font: 400 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #a99cd6; }
    </style>
  </defs>

  <g text-anchor="middle">
    <g class="card">
      <rect x="10" y="12" width="236" height="166" rx="18" fill="url(#bg)" stroke="url(#b1)" stroke-width="2.5"/>
      <text x="128" y="94" class="num" fill="url(#b1)" filter="url(#glow)">5×</text>
      <text x="128" y="128" class="lbl">NITRO SPEED</text>
      <text x="128" y="152" class="sub">10× mass · invincible</text>
    </g>
    <g class="card">
      <rect x="266" y="12" width="236" height="166" rx="18" fill="url(#bg)" stroke="url(#b2)" stroke-width="2.5"/>
      <text x="384" y="94" class="num" fill="url(#b2)" filter="url(#glow)">×10</text>
      <text x="384" y="128" class="lbl">SCORE BOOST</text>
      <text x="384" y="152" class="sub">timed multiplier pickup</text>
    </g>
    <g class="card">
      <rect x="522" y="12" width="236" height="166" rx="18" fill="url(#bg)" stroke="url(#b3)" stroke-width="2.5"/>
      <text x="640" y="94" class="num" fill="url(#b3)" filter="url(#glow)">20</text>
      <text x="640" y="128" class="lbl">VEHICLES</text>
      <text x="640" y="152" class="sub">4 playable · 16 traffic &amp; cops</text>
    </g>
    <g class="card">
      <rect x="778" y="12" width="236" height="166" rx="18" fill="url(#bg)" stroke="url(#b4)" stroke-width="2.5"/>
      <text x="896" y="94" class="num" fill="url(#b4)" filter="url(#glow)">×1.2</text>
      <text x="896" y="128" class="lbl">UPGRADE</text>
      <text x="896" y="152" class="sub">speed · steer · health · nitro</text>
    </g>
    <g class="card">
      <rect x="1034" y="12" width="236" height="166" rx="18" fill="url(#bg)" stroke="url(#b5)" stroke-width="2.5"/>
      <text x="1152" y="94" class="num" fill="url(#b5)" filter="url(#glow)">∞</text>
      <text x="1152" y="128" class="lbl">ENDLESS ROAD</text>
      <text x="1152" y="152" class="sub">procedural · never repeats</text>
    </g>
  </g>
</svg>
